name: Build Rangkuman Kerja APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/cli@7.4.3 @capacitor/core@7.4.3 @capacitor/android@7.4.3 @capacitor/filesystem@7.1.1 @capacitor/share@7.0.1 @capgo/capacitor-native-biometric@7.6.0

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/index.html
          cp manifest.json www/manifest.json
          cp sw.js www/sw.js
          cp native-files.js www/native-files.js
          cp mammoth.browser.min.js www/mammoth.browser.min.js
          cp xlsx.full.min.js www/xlsx.full.min.js

          if [ -d icons ]; then
            cp -r icons www/icons
          fi

          echo "=== WWW CONTENT ==="
          find www -maxdepth 2 -type f -print

          test -f www/index.html

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'CFGEOF'
          {
            "appId": "id.rangkumankerja.app",
            "appName": "Rangkuman Kerja",
            "webDir": "www"
          }
          CFGEOF

          cat capacitor.config.json

      - name: Add Android
        run: npx cap add android

      - name: Add custom native plugin (save to Downloads)
        run: |
          mkdir -p android/app/src/main/java/id/rangkumankerja/app
          cp MediaStoreSaverPlugin.java android/app/src/main/java/id/rangkumankerja/app/MediaStoreSaverPlugin.java
          cat android/app/src/main/java/id/rangkumankerja/app/MainActivity.java

      - name: Register custom plugin in MainActivity
        run: |
          perl -0777 -pi -e 's/import com\.getcapacitor\.BridgeActivity;/import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;/' android/app/src/main/java/id/rangkumankerja/app/MainActivity.java
          perl -0777 -pi -e 's/extends BridgeActivity \{\s*\}/extends BridgeActivity {\n  \@Override\n  public void onCreate(Bundle savedInstanceState) {\n    registerPlugin(MediaStoreSaverPlugin.class);\n    super.onCreate(savedInstanceState);\n  }\n}/' android/app/src/main/java/id/rangkumankerja/app/MainActivity.java
          cat android/app/src/main/java/id/rangkumankerja/app/MainActivity.java

      - name: Install Capacitor Assets tool
        run: npm install @capacitor/assets@3.0.5 --save-dev

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rangkuman-Kerja-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
